name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  validate-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Build release assets
        shell: bash
        run: |
          mkdir -p release-assets
          archive="threejs-scene-factory-${GITHUB_REF_NAME}.zip"
          git archive --format=zip --prefix="threejs-scene-factory-${GITHUB_REF_NAME}/" --output="release-assets/${archive}" HEAD
          cp outputs/final-delivery/observatory-project.zip release-assets/observatory-project.zip
          cp outputs/final-delivery/ACCEPTANCE_REPORT.md release-assets/ACCEPTANCE_REPORT.md
          sha256sum release-assets/*.zip > release-assets/SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Three.js Scene Factory ${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag

